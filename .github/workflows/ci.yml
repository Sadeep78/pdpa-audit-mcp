name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Test & Lint (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run Ruff linter
        run: uv run ruff check .

      - name: Run Ruff formatter check
        run: uv run ruff format --check .

      - name: Run Pytest with ResourceWarning checks
        run: uv run pytest -W error::ResourceWarning

      - name: Build wheel and sdist
        run: uv build

      - name: Install pip in environment for pip-audit
        run: uv pip install pip

      - name: Run pip-audit (Linux)
        if: runner.os != 'Windows'
        run: |
          export PIPAPI_PYTHON_LOCATION="$(pwd)/.venv/bin/python"
          uv run pip-audit

      - name: Run pip-audit (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PIPAPI_PYTHON_LOCATION = (Resolve-Path .\.venv\Scripts\python.exe).Path
          uv run pip-audit

  browser-test:
    name: Browser E2E Test (Ubuntu, Chromium)
    runs-on: ubuntu-latest
    needs: [validate]
    if: always() && (needs.validate.result == 'success' || github.event_name == 'workflow_dispatch')
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Install Playwright & Chromium
        run: |
          uv run playwright install --with-deps chromium

      - name: Run Playwright Browser Tests
        run: uv run pytest tests/test_dashboard_browser.py -v
