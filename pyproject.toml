[project]
name = "pdpa-audit-mcp"
version = "0.1.0"
description = "Sri Lanka Personal Data Protection Act (PDPA No. 9 of 2022) technical readiness audit tool and FastMCP server"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Sadeep Sasanka", email = "sasankasadeep78@gmail.com" }
]
urls = { "Homepage" = "https://github.com/Sadeep78/pdpa-audit-mcp", "Repository" = "https://github.com/Sadeep78/pdpa-audit-mcp" }
dependencies = [
    "fastmcp>=0.4.1",
    "httpx>=0.28.1,<0.29.0",
    "httpcore>=1.0.7,<1.1.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "pydantic>=2.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pyyaml>=6.0.1",
]

[project.scripts]
pdpa-audit-mcp = "pdpa_audit_mcp.server:main"
pdpa-audit-bridge = "pdpa_audit_mcp.api.bridge:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "pip-audit>=2.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdpa_audit_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "S", "BLE"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S104", "S105", "S106", "S108", "S110", "S311", "S603", "S607", "BLE001"]
"scripts/*" = ["S101", "S104", "S105", "S106", "S108", "S110", "S311", "S603", "S607", "BLE001"]

[dependency-groups]
dev = [
    "playwright>=1.64.1",
]
